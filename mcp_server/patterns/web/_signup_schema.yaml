$schema: "http://json-schema.org/draft-07/schema#"
type: object
required: [version, target_type, steps]
properties:
  version: {type: integer}
  target_type: {type: string, enum: [web]}
  host: {type: string}
  confidence: {type: string, enum: [high, med, low, stale]}
  created_by: {type: string}
  last_validated: {type: string}
  fields: {type: array, items: {type: string}}
  verification: {type: string, enum: [none, email, sms]}
  steps:
    type: array
    items:
      type: object
      required: [action]
additionalProperties: true
