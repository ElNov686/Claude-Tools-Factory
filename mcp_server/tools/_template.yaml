name: tool_name                 # snake_case, becomes the MCP tool name
description: One-line description, <200 chars

mcp_input_schema:
  arg_name: {type: string, required: true}

mcp_output_schema:
  status: {type: string, enum: [ok, failed]}

# value bindings usable in steps:
